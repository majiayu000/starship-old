# 输入配置
filebeat.inputs:
# 后端应用日志输入（JSON格式）
- type: log
  enabled: true
  paths:
    # 应用程序日志路径，基于应用配置文件中的设置
    - /app/logs/*.log
    - /usr/share/filebeat/project_logs/*.log
  json:
    keys_under_root: true
    add_error_key: true
    message_key: message
    overwrite_keys: true
    # 添加解析错误容忍
    ignore_decoding_error: true
  fields:
    log_type: application
    service: cc-starship
    timezone: Asia/Shanghai
  fields_under_root: true
  tags: ["application", "backend", "api"]
  
  # 简化多行处理配置
  multiline:
    pattern: '^{'
    negate: false
    match: after
    max_lines: 500
    timeout: 5s

# 处理器配置
processors:
  # 添加元数据
  - add_host_metadata: ~
  
  # 字段处理和增强
  - add_fields:
      target: ''
      fields:
        environment: development
  
  # 时间戳处理（北京时间 UTC+8）
  - timestamp:
      field: timestamp
      layouts:
        - '2006-01-02T15:04:05Z'
        - '2006-01-02T15:04:05.999Z'
        - '2006-01-02T15:04:05'
        - '2006-01-02 15:04:05'
        - '2006/01/02 15:04:05'
        - 'UNIX'
        - 'UNIX_MS'
      target_field: "@timestamp"
      timezone: "Asia/Shanghai"
      ignore_missing: true
  
  # 添加时区信息
  - add_fields:
      target: ''
      fields:
        timezone: "Asia/Shanghai"

# 时间设置
setup.timezone: "Asia/Shanghai"

# 数据流配置
setup.data_stream.enabled: true
setup.data_stream.namespace: "cc-starship"  # 使用服务名作为命名空间


# 禁用内置模板管理，因为我们手动创建了模板
setup.template.enabled: false

# ILM配置保持不变
setup.ilm.enabled: true
setup.ilm.policy_name: "filebeat"
setup.ilm.rollover_alias: "filebeat" 
setup.ilm.pattern: "{now/d}-000001"
setup.ilm.check_exists: true
setup.ilm.overwrite: true


# 输出配置 - 使用与模板匹配的索引命名模式
output.elasticsearch:
  hosts: ["localhost:9200"]
  username: "elastic"
  password: "changeme"
  # 暂时注释掉管道，先解决数据流问题
  # pipeline: "timezone-conversion"
  allow_older_versions: true
  
# 启用监控
monitoring.enabled: true
monitoring.elasticsearch:
  hosts: ["localhost:9200"]
  username: "elastic"
  password: "changeme"

# 增加日志级别，便于调试
logging:
  level: debug
  to_stderr: true
  metrics.enabled: false
  
# 设置更大的缓冲区和批处理
queue.mem:
  events: 4096
  flush.min_events: 512
  flush.timeout: 5s 