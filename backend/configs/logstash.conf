input {
  beats {
    port => 5044
  }
}

filter {
  # 日期处理 - 确保正确解析 timestamp 字段
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  
  # 根据日志类型应用不同处理
  if [type] == "access" {
    # 处理访问日志
    mutate {
      add_field => { "log_category" => "access" }
    }
    
    # 解析请求路径为组件
    if [request][path] {
      grok {
        match => { "[request][path]" => "/api/(?<api_version>v\d+)/(?<resource>[^/]+)(/(?<resource_id>[^/]+))?" }
        tag_on_failure => ["_grokparsefailure_path"]
        break_on_match => false
      }
    }
  }
  
  if [type] == "business" {
    # 处理业务日志
    mutate {
      add_field => { "log_category" => "business" }
    }
  }
  
  if [type] == "system" {
    # 处理系统日志
    mutate {
      add_field => { "log_category" => "system" }
    }
  }
  
  # 标准化日志级别
  mutate {
    uppercase => [ "level" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    user => "elastic"
    password => "changeme"
    index => "cc-starship-%{+YYYY.MM.dd}"
  }
}